<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simple Shop</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav>
      <h2>🛍️ SimpleShop</h2>

      <input type="text" id="searchInput" placeholder="Search products..." />

      <button id="cartButton">🛒 Cart (<span id="cartCount">0</span>)</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Welcome to SimpleShop</h1>
      <p>Find your favorite products at affordable prices.</p>
      <button onclick="scrollToProducts()">Shop Now</button>
    </section>

    <!-- Products -->
    <section class="products-section" id="productsSection">
      <h2>Our Products</h2>

      <div class="products" id="productContainer">
        <!-- Products will be added using JavaScript -->
      </div>
    </section>

    <!-- Cart -->
    <div class="cart" id="cart">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button onclick="closeCart()">✕</button>
      </div>

      <div id="cartItems">
        <p>Your cart is empty.</p>
      </div>

      <div class="cart-footer">
        <h3>Total: $<span id="cartTotal">0</span></h3>

        <button onclick="checkout()">Checkout</button>
      </div>
    </div>

    <footer>
      <p>© 2026 SimpleShop | Simple E-Commerce Website</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
